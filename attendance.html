<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b3d6e">
<title>ECOwatt — الحضور والانصراف</title>
<style>
:root{--bg:#f3f6fa;--card:#fff;--ink:#102a43;--mut:#627d98;--pri:#0b3d6e;--ok:#1a7f37;--okbg:#e6f4ea;--bad:#b42318;--badbg:#fdecea;--warn:#9a6700;--warnbg:#fff8c5;--line:#d9e2ec}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1720;--card:#16212e;--ink:#e6edf3;--mut:#9fb3c8;--pri:#4ea1ff;--ok:#56d364;--okbg:#12301c;--bad:#ff7b72;--badbg:#3b1717;--warn:#e3b341;--warnbg:#332a10;--line:#2a3a4c}}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Tahoma,"Segoe UI",Arial,sans-serif}
.wrap{max-width:480px;margin:0 auto;padding:16px 16px 40px}
header{display:flex;align-items:center;gap:10px;margin-bottom:14px}header b{font-size:18px}header small{color:var(--mut);display:block;font-size:12px}
.logo{width:42px;height:42px;border-radius:10px;background:var(--pri);color:#fff;display:grid;place-items:center;font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
h2{font-size:17px;margin:0 0 8px}p{margin:6px 0}.mut{color:var(--mut);font-size:13px}
button{font:inherit;width:100%;padding:14px;border-radius:12px;border:0;background:var(--pri);color:#fff;font-weight:700;margin-top:10px;cursor:pointer}
button.sec{background:transparent;color:var(--pri);border:1px solid var(--line)}button:disabled{opacity:.55}
input{font:inherit;width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);text-align:center;letter-spacing:4px;margin-top:8px}
.msg{border-radius:12px;padding:12px 14px;margin:10px 0;display:none}.msg.ok{display:block;background:var(--okbg);color:var(--ok)}.msg.bad{display:block;background:var(--badbg);color:var(--bad)}.msg.warn{display:block;background:var(--warnbg);color:var(--warn)}
.big{font-size:44px;font-weight:700;text-align:center;margin:6px 0}.res{text-align:center}
.row{display:flex;justify-content:space-between;gap:8px;border-top:1px solid var(--line);padding:8px 0;font-size:14px}.row:first-child{border-top:0}
.pill{display:inline-block;padding:2px 10px;border-radius:20px;font-size:12px;font-weight:700}.pill.ok{background:var(--okbg);color:var(--ok)}.pill.warn{background:var(--warnbg);color:var(--warn)}.pill.bad{background:var(--badbg);color:var(--bad)}
video{width:100%;border-radius:12px;background:#000;margin-top:8px}
.steps{margin:8px 0 0;padding:0 18px;color:var(--mut);font-size:13px}
</style>
</head>
<body>
<div class="wrap">
<header><div class="logo">EW</div><div><b>ECOwatt — الحضور والانصراف</b><small id="hdrSub">تسجيل آمن بالبصمة أو الوجه</small></div></header>
<div id="msg" class="msg"></div>
<div id="view"></div>
<p class="mut" style="text-align:center;margin-top:18px">لا يُرسل أي بيانات بيومترية — البصمة تبقى على جهازك، ويُرسل توقيع تحقق فقط.</p>
</div>
<script>
/* ECOwatt 20261203 — صفحة الموبايل للحضور. تُستضاف على HTTPS (GitHub Pages مجاناً).
   عدّل DEFAULT_SERVER إلى رابط نشر Code.gs (ينتهي بـ /exec)، أو يصلها تلقائياً من رابط التفعيل (&s=). */
var DEFAULT_SERVER='';
var K='ecoAtt_v1';
var $=function(id){return document.getElementById(id);};
function E(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function st(){try{return JSON.parse(localStorage.getItem(K)||'null')||{};}catch(e){return {};}}
function save(o){try{localStorage.setItem(K,JSON.stringify(o));}catch(e){}}
function say(t,k){var m=$('msg');m.className='msg '+(k||'bad');m.textContent=t;if(!t)m.className='msg';}
function hashParams(){var h=location.hash.replace(/^#/,''),o={};h.split('&').forEach(function(p){var i=p.indexOf('=');if(i>0)o[decodeURIComponent(p.slice(0,i))]=decodeURIComponent(p.slice(i+1));});return o;}
function b2u(buf){var b=new Uint8Array(buf),s='';for(var i=0;i<b.length;i++)s+=String.fromCharCode(b[i]);return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
function u2b(s){s=String(s).replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
function server(){return st().server||DEFAULT_SERVER;}
function api(a,body){var s=server();if(!s)return Promise.reject(new Error('رابط خادم الحضور غير مضبوط — افتح رابط التفعيل من الإدارة'));body=body||{};body.a=a;
 return fetch(s,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body),redirect:'follow'}).then(function(r){return r.json();}).then(function(x){if(!x||!x.ok){var e=new Error((x&&x.error)||'تعذّر الاتصال بالخادم');e.code=x&&x.code;throw e;}return x;});}
function secureOk(){return location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1';}
function webauthnOk(){return !!(window.PublicKeyCredential&&navigator.credentials&&navigator.credentials.create);}
function busy(btn,on,t){if(!btn)return;btn.disabled=!!on;if(t)btn.textContent=t;}
function fmtErr(e){var m=e&&e.message||String(e);if(e&&e.name==='NotAllowedError')return 'أُلغي التحقق بالبصمة/الوجه أو انتهت مهلته — أعد المحاولة';if(e&&e.name==='InvalidStateError')return 'هذا الجهاز مسجّل مسبقاً';if(e&&e.code===1&&e.PERMISSION_DENIED!==undefined)return 'اسمح للصفحة باستخدام الموقع (GPS) من إعدادات المتصفح';return m;}

/* ---------- التفعيل ---------- */
function activate(code){
 $('view').innerHTML='<div class="card"><h2>تفعيل هذا الجهاز</h2><p class="mut">جارٍ التحقق من رابط التفعيل…</p></div>';
 api('m.activate.begin',{code:code}).then(function(r){
  $('view').innerHTML='<div class="card"><h2>تفعيل جهاز للموظف</h2><div class="row"><span>الموظف</span><b>'+E(r.name)+'</b></div><div class="row"><span>اسم المستخدم</span><b>'+E(r.username)+'</b></div><div class="row"><span>الفرع</span><b>'+E(r.branch)+'</b></div>'+
  '<ol class="steps"><li>اضغط الزر وسجّل بصمتك أو وجهك على هذا الجهاز.</li><li>يبقى الجهاز «بانتظار الاعتماد» حتى توافق الإدارة.</li></ol><input id="lbl" placeholder="اسم الجهاز (مثال: جوالي)" style="letter-spacing:0" maxlength="40"><button id="go">🔐 تسجيل البصمة / الوجه</button></div>';
  $('go').onclick=function(){var btn=this;busy(btn,true,'⏳ بانتظار البصمة…');say('');
   navigator.credentials.create({publicKey:{challenge:u2b(r.challenge),rp:{id:r.rpId,name:'ECOwatt الحضور'},user:{id:u2b(r.userId),name:r.username,displayName:r.name||r.username},
    pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required',residentKey:'preferred'},timeout:90000,attestation:'none'}})
   .then(function(c){busy(btn,true,'⏳ جارٍ الإرسال…');return api('m.activate.finish',{challengeId:r.challengeId,label:$('lbl').value||'',ua:navigator.userAgent,cred:{id:c.id,clientDataJSON:b2u(c.response.clientDataJSON),attestationObject:b2u(c.response.attestationObject)}});})
   .then(function(f){var o=st();o.username=f.username;o.deviceId=f.deviceId;o.credId=f.credId;o.name=r.name;save(o);history.replaceState(null,'',location.pathname);home('✔ تم تسجيل الجهاز. هو الآن «بانتظار الاعتماد» من الإدارة.','ok');})
   .catch(function(e){busy(btn,false,'🔐 تسجيل البصمة / الوجه');say(fmtErr(e));});};
 }).catch(function(e){$('view').innerHTML='';say(fmtErr(e));});
}

/* ---------- الصفحة الرئيسية ---------- */
var STATUS=null;
function home(m,k){
 var o=st();if(!o.deviceId){$('view').innerHTML='<div class="card"><h2>هذا الجهاز غير مفعّل</h2><p>اطلب من الإدارة «رابط تفعيل جهاز» من بطاقتك في شؤون الموظفين، وافتحه على هذا الجوال.</p></div>';if(m)say(m,k);return;}
 $('view').innerHTML='<div class="card"><p class="mut">جارٍ التحميل…</p></div>';
 api('m.status',{username:o.username,deviceId:o.deviceId}).then(function(s){STATUS=s;$('hdrSub').textContent=s.name+' — '+s.branch;
  var pill=s.device==='active'?'<span class="pill ok">معتمد</span>':(s.device==='pending'?'<span class="pill warn">بانتظار الاعتماد</span>':'<span class="pill bad">'+(s.device==='suspended'?'موقوف':'محذوف')+'</span>');
  var h='<div class="card"><div class="row"><span>الموظف</span><b>'+E(s.name)+'</b></div><div class="row"><span>الجهاز</span>'+pill+'</div><div class="row"><span>آخر تسجيل</span><b>'+(s.last?((s.last.type==='IN'?'حضور ':'انصراف ')+E(s.last.local)+(s.last.auto?' (تلقائي)':'')):'—')+'</b></div></div>';
  if(s.device==='active'){
   h+='<div class="card"><h2>تسجيل حضور / انصراف</h2><p class="mut">امسح رمز QR المعروض على شاشة الفرع بكاميرا الجوال، أو من هنا:</p><button id="scan">📷 مسح رمز الفرع</button><div id="cam"></div>';
   if(s.methods&&s.methods.otp)h+='<button class="sec" id="otpb">🔑 تسجيل استثنائي برمز مؤقت من الإدارة</button>';
   h+='</div>';
   if(s.methods&&s.methods.pin&&!s.pinSet)h+='<div class="card"><h2>رمز PIN لجهاز الفرع</h2><p class="mut">رمز شخصي تستخدمه على جهاز الفرع كطريقة بديلة. إعادة تعيينه من الإدارة فقط.</p><input id="pin" type="password" inputmode="numeric" maxlength="8" placeholder="••••"><button id="pinb">حفظ الرمز (بعد البصمة)</button></div>';
  }
  h+='<button class="sec" id="forget">إزالة التفعيل من هذا المتصفح</button>';
  $('view').innerHTML=h;
  if($('scan'))$('scan').onclick=scan;
  if($('otpb'))$('otpb').onclick=function(){var c=prompt('أدخل الرمز المؤقت (6 أرقام) من الإدارة');if(c)punch({otp:String(c).trim()});};
  if($('pinb'))$('pinb').onclick=setPin;
  $('forget').onclick=function(){if(confirm('إزالة التفعيل من هذا المتصفح؟ ستحتاج رابط تفعيل جديد.')){localStorage.removeItem(K);home();}};
  if(m)say(m,k);
 }).catch(function(e){$('view').innerHTML='<div class="card"><button id="rt">إعادة المحاولة</button></div>';$('rt').onclick=function(){home();};say(fmtErr(e));});
}

/* ---------- المسح داخل الصفحة (إن دعمه المتصفح) ---------- */
function scan(){
 if(!('BarcodeDetector' in window)){say('افتح كاميرا الجوال وامسح رمز الفرع — سيفتح هذه الصفحة تلقائياً.','warn');return;}
 var det=new BarcodeDetector({formats:['qr_code']}),box=$('cam');box.innerHTML='<video id="vid" playsinline muted></video><button class="sec" id="stopc">إيقاف الكاميرا</button>';var stream=null,stop=false;
 function end(){stop=true;try{stream&&stream.getTracks().forEach(function(t){t.stop();});}catch(e){}box.innerHTML='';}
 $('stopc').onclick=end;
 navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}}).then(function(s){stream=s;var v=$('vid');v.srcObject=s;v.play();
  (function loop(){if(stop)return;det.detect(v).then(function(c){var raw=c&&c[0]&&c[0].rawValue;if(raw){var m=/[#&]q=([^&]+)/.exec(raw);if(m){end();punch({q:decodeURIComponent(m[1])});return;}}requestAnimationFrame(loop);}).catch(function(){requestAnimationFrame(loop);});})();
 }).catch(function(e){end();say('تعذّر فتح الكاميرا: '+fmtErr(e));});
}

/* ---------- الموقع ---------- */
function gps(){return new Promise(function(res,rej){if(!navigator.geolocation)return rej(new Error('الجهاز لا يدعم تحديد الموقع'));navigator.geolocation.getCurrentPosition(function(p){res({lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy,ts:p.timestamp||Date.now()});},function(e){rej(e.code===1?new Error('اسمح للصفحة باستخدام الموقع (GPS)'):new Error('تعذّر تحديد الموقع — فعّل GPS'));},{enableHighAccuracy:true,timeout:20000,maximumAge:0});});}
function myIp(){return fetch('https://api.ipify.org?format=json').then(function(r){return r.json();}).then(function(j){return j.ip||'';}).catch(function(){return '';});}

/* ---------- التسجيل ---------- */
function punch(src){
 var o=st();say('');$('view').innerHTML='<div class="card res"><p class="big">⏳</p><p>جارٍ التحقق… سيُطلب منك البصمة أو الوجه</p></div>';
 var gp=gps(),ip=myIp(),ctx;
 api('m.auth.begin',{username:o.username,deviceId:o.deviceId,purpose:'punch',q:src.q||'',otp:src.otp||''}).then(function(r){ctx=r;
  return navigator.credentials.get({publicKey:{challenge:u2b(r.challenge),rpId:r.rpId,allowCredentials:[{type:'public-key',id:u2b(r.credId)}],userVerification:'required',timeout:60000}});
 }).then(function(a){return Promise.all([gp,ip]).then(function(x){return api('m.punch.finish',{challengeId:ctx.challengeId,gps:x[0],ip:x[1],assertion:{id:a.id,clientDataJSON:b2u(a.response.clientDataJSON),authenticatorData:b2u(a.response.authenticatorData),signature:b2u(a.response.signature)}});});})
 .then(function(r){history.replaceState(null,'',location.pathname);
  $('view').innerHTML='<div class="card res"><p class="big">'+(r.type==='IN'?'✅':'👋')+'</p><h2>'+(r.type==='IN'?'تم تسجيل الحضور':'تم تسجيل الانصراف')+'</h2><p class="big" style="font-size:34px">'+E(r.local)+'</p><p>'+E(r.name)+' — '+E(r.branch)+'</p>'+(r.flags?'<p class="mut">'+E(r.flags)+'</p>':'')+'<button class="sec" id="bk">رجوع</button></div>';$('bk').onclick=function(){home();};
 }).catch(function(e){history.replaceState(null,'',location.pathname);home();setTimeout(function(){say(fmtErr(e));},300);});
}
function setPin(){var pin=$('pin').value,o=st(),btn=$('pinb');if(!/^\d{4,8}$/.test(pin)){say('الرمز من 4 إلى 8 أرقام');return;}busy(btn,true,'⏳ بانتظار البصمة…');
 api('m.auth.begin',{username:o.username,deviceId:o.deviceId,purpose:'pin'}).then(function(r){return navigator.credentials.get({publicKey:{challenge:u2b(r.challenge),rpId:r.rpId,allowCredentials:[{type:'public-key',id:u2b(r.credId)}],userVerification:'required',timeout:60000}}).then(function(a){return api('m.pin.set',{challengeId:r.challengeId,pin:pin,assertion:{id:a.id,clientDataJSON:b2u(a.response.clientDataJSON),authenticatorData:b2u(a.response.authenticatorData),signature:b2u(a.response.signature)}});});})
 .then(function(){home('✔ حُفظ رمز PIN','ok');}).catch(function(e){busy(btn,false,'حفظ الرمز (بعد البصمة)');say(fmtErr(e));});}

/* ---------- البداية ---------- */
function route(){
 if(!secureOk()){say('يجب فتح هذه الصفحة عبر HTTPS (إلزامي).');return;}
 if(!webauthnOk()){say('هذا المتصفح لا يدعم البصمة/الوجه للويب. استخدم Chrome أو Safari حديث.');return;}
 var h=hashParams(),o=st();
 if(h.s&&/^https:\/\/script\.google\.com\//.test(h.s)||(h.s&&/^http:\/\/localhost/.test(h.s))){o.server=h.s;save(o);}
 if(h.act){activate(h.act);return;}
 if(h.q){if(!o.deviceId){say('هذا الجهاز غير مفعّل بعد — اطلب رابط التفعيل من الإدارة.');home();return;}punch({q:h.q});return;}
 home();
}
window.addEventListener('hashchange',function(){if(location.hash&&location.hash.length>2){say('');route();}});
route();
</script>
</body>
</html>
